<div class="login-container">
  <h2>Login</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" formControlName="email" class="form-control" placeholder="Enter your email">
      <div *ngIf="emailControl?.invalid && (emailControl?.dirty || emailControl?.touched)" class="error-message alert alert-danger">
        <small *ngIf="emailControl?.errors?.['required']">Email is required.</small>
        <small *ngIf="emailControl?.errors?.['email']">Please enter a valid email address.</small>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" formControlName="password" class="form-control" placeholder="Enter your password">
      <div *ngIf="passwordControl?.invalid && (passwordControl?.dirty || passwordControl?.touched)" class="error-message alert alert-danger">
        <small *ngIf="passwordControl?.errors?.['required']">Password is required.</small>
      </div>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid || isLoading">
      <span *ngIf="!isLoading">Login</span>
      <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      <span *ngIf="isLoading"> Logging in...</span>
    </button>
  </form>

  <div *ngIf="errorMessage" class="error-message alert alert-danger mt-3">
    {{ errorMessage }}
  </div>
  <div *ngIf="successMessage && !errorMessage" class="success-message alert alert-success mt-3">
    {{ successMessage }}
  </div>

  <div class="mt-3">
    <p>Don't have an account? <a routerLink="/register">Register here</a></p>
    <!-- Add link for "Forgot Password?" if implementing password reset -->
    <!-- <p><a routerLink="/forgot-password">Forgot Password?</a></p> -->
  </div>
</div>
