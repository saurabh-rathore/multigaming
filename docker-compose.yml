version: '3.8'
services:
  frontend:
    build: ./packages/frontend
    ports:
      - '80:80'
  backend:
    build: ./packages/backend
    ports:
      - '3000:3000'
    depends_on:
      - db
  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_DATABASE: 'gaming_platform'
      MYSQL_USER: 'user'
      MYSQL_PASSWORD: 'password'
      MYSQL_ROOT_PASSWORD: 'password'
    ports:
      - '3306:3306'
    volumes:
      - db-data:/var/lib/mysql
volumes:
  db-data:
